name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    # Optional: only review when certain paths change.
    # paths:
    #   - "src/**"

permissions: {}

jobs:
  claude-review:
    # Dependency bumps are mechanical and carry a real per-run cost, so they are
    # not worth a review. Identify them by PR author rather than event actor.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The review only reads the checkout; findings are posted through the
          # API with the action's own token.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Forces tag mode, which posts a tracking comment and updates it as the
          # review runs. Without it these events run in agent mode, where inline
          # comments are the only delivery channel.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` makes the plugin publish its findings; without it the run
          # completes green having posted nothing.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Mirrors the allowed-tools frontmatter of the plugin's code-review.md.
          # The plugin's own declaration may not be honoured in headless runs, so
          # the full set is granted here.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
