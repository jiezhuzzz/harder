version: 2

updates:
  # Actions pinned in .github/workflows/. They are pinned by commit SHA, which
  # Dependabot understands: it bumps the SHA and rewrites the trailing version
  # comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Everything in one PR per run, majors included.
      actions:
        patterns: ["*"]

  # Flake inputs pinned in flake.lock
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # An update-types filter would not work here even if we wanted one:
      # flake.lock pins inputs by git rev with no version field, so there is no
      # SemVer for Dependabot to classify a bump against.
      flake-inputs:
        patterns: ["*"]

